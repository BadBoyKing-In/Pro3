<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
table{
    width: 450px;
    height: 200px;
    border-bottom: 1px solid black;

}

#border{
    border-bottom: 1px solid black;
}




</style>

<body>
    <div class="One">
        <div class="Box">
            <h2>Available Courses</h2>
            <table border="1">
                <tr>
                    <th>Course</th>
                    <th>Duration</th>
                    <th>Eligiblity</th>
                    <th>Fees</th>

                </tr>

                <tr>
                    <td> B.Sc Computer Science</td>
                    <td>3 Years</td>
                    <td>12th</td>
                    <td>₹45,000</td>

                </tr>
                <tr>
                    <td>BCA</td>
                    <td>3 Years</td>
                    <td>12th</td>
                    <td>₹50,000</td>
                </tr>

                <tr>
                    <td>B.Com</td>
                    <td>3 Years</td>
                    <td>12th</td>
                    <td>₹40,000</td>

                </tr>

                <tr>
                    <td>MCA</td>
                    <td>2 Years</td>
                    <td>Degree</td>
                    <td>₹70,000</td>
                </tr>
                
            </table>
            <p id="border"></p>
        </div>
        <div class="two">
            <h2>Student Registration Form</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" placeholder="Enter your name"> <br><br>
                <label for="Date of Birth">Date of Birth:</label>
                <input type="date"> <br><br>
                <label id="Gmail">Gmail:</label>
                <input type="email" placeholder="Enter your Gmail" id="Gmail"><br><br>
                <label id="Number">Phone Number:</label>
                <input type="number" Placeholder="enter you number" id="Number"><br><br>
                <label name="Gender">Gender:</label>
                <input type="radio" name="Gender" value="Male">Male
                <input type="radio" name="Gender" value="Female">Female
                <input type="radio" name="Gender" value="Others">Others <br><br>

                <label id:"Course">Select Course:</label>
                <select id="Course">
                    <li>
                        <option value="">--Select Course:--</option>
                        <option value="B.SC Computer Science">B.SC Computer Science</option>
                        <option value=" BCA">BCA</option>
                        <option value="B.COM">B.COM</option>
                        <option value="MCA">MCA</option>

                    </li>
                </select><br><br>
                <label id="Address"> Address:</label><br>
                <textarea placeholder="Enter your Address"></textarea>

            </form>
        </div>
    </div>
</body>

</html>
